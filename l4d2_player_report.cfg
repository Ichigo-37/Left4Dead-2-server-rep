// ============================================================================
//  l4d2_player_report.cfg
//  Configuração do Plugin de Report de Jogadores — Left 4 Dead 2
//
//  Local:  left4dead2/cfg/sourcemod/l4d2_player_report.cfg
//          (gerado automaticamente pelo plugin na primeira execução)
//
//  Edite os valores abaixo conforme a necessidade do seu servidor.
// ============================================================================


// ──────────────────────────────────────────────────────────────────────────────
//  GERAL
// ──────────────────────────────────────────────────────────────────────────────

// Habilita (1) ou desabilita (0) o sistema de reports.
// Útil para desligar temporariamente sem remover o plugin.
l4d2_report_enabled "1"


// ──────────────────────────────────────────────────────────────────────────────
//  COOLDOWN
// ──────────────────────────────────────────────────────────────────────────────

// Tempo mínimo em SEGUNDOS que um jogador deve aguardar entre dois reports.
// Evita spam e uso abusivo do sistema.
// Padrão: 60 (1 minuto). Recomendado: entre 30 e 120.
l4d2_report_cooldown "60.0"


// ──────────────────────────────────────────────────────────────────────────────
//  ADMINISTRADORES
// ──────────────────────────────────────────────────────────────────────────────

// Flag SourceMod que determina quem recebe as notificações de report.
// O jogador precisa ter essa flag configurada em:
//   addons/sourcemod/configs/admins.cfg  (ou admins_simple.ini)
//
// Flags comuns:
//   "b" — Acesso genérico (kick, ban básico)          ← recomendado para a maioria
//   "c" — Acesso a votos e comandos gerais
//   "d" — Acesso a configurações do servidor
//   "e" — Acesso ao RCON
//   "f" — Acesso a cheats (sv_cheats)
//   "g" — Acesso a root (todos os acessos)
//   "o" — Acesso a ban permanente
//   "z" — Acesso total / root (superadmin)
//
// Para notificar QUALQUER admin, use "b" (flag básica que todo admin costuma ter).
// Para restringir a notificação apenas a admins seniors, use "o" ou "z".
l4d2_report_admin_flag "b"

// Notifica TODOS os admins online (1) ou apenas o primeiro admin encontrado (0)?
// Com valor 1, todos os admins receberão a mensagem no chat simultaneamente.
l4d2_report_notify_all "1"


// ──────────────────────────────────────────────────────────────────────────────
//  ALERTAS ESPECIAIS
// ──────────────────────────────────────────────────────────────────────────────

// Número mínimo de reports acumulados contra um jogador
// para disparar uma notificação de alerta diferenciada (em vermelho).
// Recomendado: entre 2 e 5.
l4d2_report_alert_threshold "5"


// ──────────────────────────────────────────────────────────────────────────────
//  LOGGING
// ──────────────────────────────────────────────────────────────────────────────

// Salva todos os reports em arquivo de log (1 = sim, 0 = não).
// O arquivo é gravado em: left4dead2/logs/l4d2_player_report.log
// Útil para auditar reports mesmo quando não há admin online.
l4d2_report_log "1"


// ──────────────────────────────────────────────────────────────────────────────
//  MENSAGEM DE BOAS-VINDAS
// ──────────────────────────────────────────────────────────────────────────────

// Exibe uma mensagem no chat informando o comando !report quando o jogador entra.
// 1 = sim (recomendado), 0 = não.
l4d2_report_welcome "1"

// Quantos segundos após entrar na partida a mensagem de boas-vindas é exibida.
// Um pequeno delay (ex: 5s) garante que o jogador já carregou o mapa e verá a mensagem.
// Padrão: 5.0 — Recomendado: entre 3 e 10.
l4d2_report_welcome_delay "10.0"
