// ============================================================================
// L4D2 Discord Report System - Configuracao
// Arquivo: addons/sourcemod/cfg/sourcemod/discord_report.cfg
// ============================================================================

// Ativa ou desativa o sistema de reports.
// 0 = desativado | 1 = ativado
sm_dreport_enabled "1"

// URL completa do Webhook do Discord.
// Crie em: Discord > Configuracoes do canal > Integracoes > Webhooks
sm_dreport_webhook "https://discord.com/api/webhooks/1490554774389788823/M2Wqm_0axfY-V0WtmdwD5Cet2FX0xrRGkyiLLU3iEMCBTkWqZb8ZY96e7AganvW1E-7X"

// Tempo em segundos que um jogador deve aguardar entre reports.
// Minimo: 0 | Maximo: 600
sm_dreport_cooldown "60"

// Cor da barra lateral do embed em valor decimal.
// Vermelho  = 16711680
// Laranja   = 16744272
// Amarelo   = 16776960
// Verde     = 65280
// Azul      = 255
// Roxo      = 8388736
sm_dreport_color "16711680"

// ID do cargo do Discord a ser mencionado quando um report chegar.
// 0 = nenhuma mencao | Exemplo: "1234567890123456789"
// Para obter o ID: Discord > Configuracoes do servidor > Cargos > clique direito > Copiar ID
sm_dreport_role_id "0"

// Nome do servidor exibido no embed do report.
sm_dreport_servername "Servidor #3"

// URL de uma imagem exibida como thumbnail no embed (icone do servidor).
// Deixe vazio para nenhuma imagem.
sm_dreport_thumbnail ""
